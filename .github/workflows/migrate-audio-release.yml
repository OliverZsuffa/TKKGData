name: Migrate independent audio release data

on:
  push:
    branches:
      - plan/008-independent-provider-tracklists
    paths:
      - .github/workflows/migrate-audio-release.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved migration branch
        uses: actions/checkout@v4
        with:
          ref: plan/008-independent-provider-tracklists
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Migrate and validate the full catalogue
        run: python -m scraper.migrate_audio_release --write --report data/audio-migration-report.json
      - name: Commit migrated catalogue and remove old override file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/episodes.csv data/dataset-metadata.json data/audio-migration-report.json data/spotify_structure_overrides.json
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Migrate audio release catalogue and remove overrides"
            git push origin HEAD:plan/008-independent-provider-tracklists
          fi
