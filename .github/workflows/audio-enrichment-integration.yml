name: Test episode number to verified links

on:
  pull_request:
    paths:
      - "scraper/audio_enrichment.py"
      - "tests/test_audio_enrichment.py"
      - "requirements-audio.txt"
      - ".github/workflows/audio-enrichment-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Episode ${{ matrix.episode }} live discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        episode: [148, 149, 150]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install metadata discovery dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-audio.txt
      - name: Confirm metadata workflow does not depend on FFmpeg
        run: |
          if grep -R -n -E 'ffmpeg|subprocess\.run|spotdl save' scraper/audio_enrichment.py; then
            echo "Metadata discovery contains a downloader or FFmpeg dependency."
            exit 1
          fi
      - name: Resolve episode number to provider links
        run: |
          python -m scraper.audio_enrichment \
            --episode "${{ matrix.episode }}" \
            --report "data/audio-enrichment-report-${{ matrix.episode }}.json"
      - name: Upload episode discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkkgdata-episode-${{ matrix.episode }}-link-report
          path: data/audio-enrichment-report-${{ matrix.episode }}.json
          if-no-files-found: warn
          retention-days: 30
