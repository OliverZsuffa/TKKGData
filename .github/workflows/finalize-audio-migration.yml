name: Finalize independent audio dataset exports

on:
  push:
    branches:
      - plan/008-independent-provider-tracklists
    paths:
      - .github/workflows/finalize-audio-migration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: plan/008-independent-provider-tracklists
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Validate and regenerate all dataset exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scraper.export import write_catalogue
          from scraper.validate import validate_catalogue

          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          errors = validate_catalogue(episodes)
          if errors:
              raise SystemExit("\n".join(errors))
          write_catalogue(episodes, Path("data"))
          final_episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          final_errors = validate_catalogue(final_episodes)
          if final_errors:
              raise SystemExit("\n".join(final_errors))
          Path("data/spotify_structure_overrides.json").unlink(missing_ok=True)
          PY
      - name: Commit CSV, metadata, and removal of the override file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.csv data/dataset-metadata.json data/spotify_structure_overrides.json
          if git diff --cached --quiet; then
            echo "Exports are already current."
          else
            git commit -m "Regenerate exports and remove Spotify overrides"
            git push origin HEAD:plan/008-independent-provider-tracklists
          fi
