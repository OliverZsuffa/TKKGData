name: Remove redundant legacy audio pairings

on:
  push:
    branches:
      - plan/008-independent-provider-tracklists
    paths:
      - .github/workflows/remove-legacy-pairing.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: plan/008-independent-provider-tracklists
      - name: Remove historical pairing copies from both exports
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path.cwd()
          episodes_path = root / "data" / "episodes.json"
          episodes = json.loads(episodes_path.read_text(encoding="utf-8"))
          removed_json = 0
          for episode in episodes:
              for track in (episode.get("audio_release") or {}).get("youtube_music", {}).get("tracks", []):
                  if "legacy_pairing" in track:
                      del track["legacy_pairing"]
                      removed_json += 1
          episodes_path.write_text(
              json.dumps(episodes, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          csv_path = root / "data" / "episodes.csv"
          with csv_path.open("r", encoding="utf-8-sig", newline="") as source:
              reader = csv.DictReader(source)
              fieldnames = reader.fieldnames
              rows = list(reader)

          removed_csv = 0
          for row in rows:
              if not row.get("audio_release"):
                  continue
              release = json.loads(row["audio_release"])
              for track in (release.get("youtube_music") or {}).get("tracks", []):
                  if "legacy_pairing" in track:
                      del track["legacy_pairing"]
                      removed_csv += 1
              row["audio_release"] = json.dumps(release, ensure_ascii=False)

          with csv_path.open("w", encoding="utf-8-sig", newline="") as target:
              writer = csv.DictWriter(target, fieldnames=fieldnames, lineterminator="\r\n")
              writer.writeheader()
              writer.writerows(rows)

          if removed_json != 7205 or removed_csv != 7205:
              raise SystemExit(
                  f"Unexpected cleanup counts: JSON={removed_json}, CSV={removed_csv}"
              )
          print(f"Removed {removed_json} JSON and {removed_csv} CSV legacy_pairing fields.")
          PY
      - name: Verify no legacy pairing fields remain
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          for episode in episodes:
              for track in (episode.get("audio_release") or {}).get("youtube_music", {}).get("tracks", []):
                  assert "legacy_pairing" not in track, episode.get("number")

          with Path("data/episodes.csv").open("r", encoding="utf-8-sig", newline="") as source:
              for row in csv.DictReader(source):
                  if row.get("audio_release"):
                      release = json.loads(row["audio_release"])
                      for track in (release.get("youtube_music") or {}).get("tracks", []):
                          assert "legacy_pairing" not in track

          print("Both catalogue exports are clean.")
          PY
      - name: Commit cleaned catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/episodes.csv
          git commit -m "Remove redundant legacy audio pairings"
          git push origin HEAD:plan/008-independent-provider-tracklists
