name: Update TKKG dataset

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "schemas/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/update-catalogue.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

concurrency:
  group: tkkgdata-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh checkout to the latest main after entering the data-write queue
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scraper
        run: python -m scraper.run
      - name: Validate output
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          from scraper.validate import validate_catalogue
          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          metadata = json.loads(Path("data/dataset-metadata.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/episode.schema.json").read_text(encoding="utf-8"))
          metadata_schema = json.loads(Path("schemas/dataset-metadata.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(metadata_schema, format_checker=FormatChecker()).validate(metadata)
          errors = validate_catalogue(episodes)
          if len(episodes) != metadata["episode_count"]:
              errors.append("dataset metadata episode_count does not match episodes.json")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
      - name: Preserve scrape report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkkgdata-scrape-report
          path: data/scrape-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/episodes.csv data/dataset-metadata.json data/scrape-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh TKKG dataset"
            git pull --rebase origin main
            git push
          else
            echo "Dataset has not changed."
          fi
