name: Complete Request 009 catalogue alias

on:
  push:
    branches:
      - request/009-audio-track-naming-and-availability

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: request/009-audio-track-naming-and-availability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add episode 226 alternate title
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/episodes.json")
          episodes = json.loads(path.read_text(encoding="utf-8"))
          episode = next(item for item in episodes if item["number"] == 226)
          aliases = episode.setdefault("alternate_titles", [])
          alias = "Der Täter ist unter uns"
          if alias not in aliases:
              aliases.append(alias)
              path.write_text(
                  json.dumps(episodes, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Run tests and catalogue validation
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scraper.validate import validate_catalogue

          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          errors = validate_catalogue(episodes)
          if errors:
              raise SystemExit("\n".join(errors))
          episode = next(item for item in episodes if item["number"] == 226)
          assert "Der Täter ist unter uns" in episode["alternate_titles"]
          print(f"Validated {len(episodes)} episodes and episode 226 alternate title")
          PY
      - name: Commit catalogue update and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/request-009-catalogue-alias.yml
          git add data/episodes.json
          if ! git diff --cached --quiet; then
            git commit -m "Add episode 226 alternate title"
            git push origin HEAD:request/009-audio-track-naming-and-availability
          fi
