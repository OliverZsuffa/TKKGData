name: Discover TKKG audio sources

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number to resolve (leave empty to process missing mappings)"
        required: false
        type: string
        default: ""
      playlist_id:
        description: "Optional YouTube Music playlist ID for one selected episode"
        required: false
        type: string
        default: ""
      limit:
        description: "Maximum number of episodes to process"
        required: true
        type: number
        default: 5
      write:
        description: "Write verified mappings to the central catalogue"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tkkgdata-data-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh checkout to the latest main after entering the data-write queue
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper and metadata discovery dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-audio.txt
      - name: Discover and verify audio sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EPISODE: ${{ inputs.episode }}
          INPUT_PLAYLIST_ID: ${{ inputs.playlist_id }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_WRITE: ${{ inputs.write }}
        run: |
          ARGS=(--limit "${INPUT_LIMIT:-5}")
          if [ -n "${INPUT_EPISODE:-}" ]; then ARGS+=(--episode "$INPUT_EPISODE"); fi
          if [ -n "${INPUT_PLAYLIST_ID:-}" ]; then ARGS+=(--playlist-id "$INPUT_PLAYLIST_ID"); fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            INPUT_WRITE=true
            ARGS+=(--latest-first)
          fi
          if [ "$INPUT_WRITE" = "true" ]; then ARGS+=(--write); fi
          python -m scraper.audio_enrichment "${ARGS[@]}"
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkkgdata-audio-enrichment-report
          path: data/audio-enrichment-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified audio mappings
        if: success() && (inputs.write == true || github.event_name == 'schedule')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/episodes.csv data/dataset-metadata.json data/scrape-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: add verified TKKG audio sources"
            git pull --rebase origin main
            git push
          else
            echo "No verified audio mappings were added."
          fi
