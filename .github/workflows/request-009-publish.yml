name: Request 009 publish verified provider releases

on:
  push:
    branches:
      - request/009-audio-track-naming-and-availability

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: request/009-audio-track-naming-and-availability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audio.txt
      - name: Publish only independently verified releases
        run: |
          python -m scraper.audio_enrichment \
            --episode 226 --episode 238 --episode 239 \
            --write --report request-009-publish-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("request-009-publish-report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "verified": [
                  {
                      "number": item["number"],
                      "spotify_tracks": item["audio_release"]["spotify"]["track_count"],
                      "youtube_music_tracks": item["audio_release"]["youtube_music"]["track_count"],
                      "status": item["audio_release"]["verification"]["status"],
                  }
                  for item in report.get("verified", [])
              ],
              "failures": report.get("failures", []),
              "catalogue_updated": report.get("catalogue_updated"),
          }, ensure_ascii=False, indent=2))
          if report.get("failures"):
              raise SystemExit("Discovery failures prevent publishing all requested episodes.")
          if {item["number"] for item in report.get("verified", [])} != {226, 238, 239}:
              raise SystemExit("Not all three target episodes received verified provider releases.")
          PY
      - name: Run unit tests and catalogue validation
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scraper.validate import validate_catalogue
          from scraper.audio_coverage_audit import build_report

          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          errors = validate_catalogue(episodes)
          if errors:
              raise SystemExit("\n".join(errors))
          for number in (226, 238, 239):
              episode = next(item for item in episodes if item["number"] == number)
              release = episode.get("audio_release", {})
              assert release.get("verification", {}).get("status") == "verified"
          audit = build_report(episodes)
          print("Post-publication audit:")
          print(json.dumps({
              "ready_for_discovery": [x["number"] for x in audit["ready_for_discovery"]],
              "needs_investigation": [x["number"] for x in audit["needs_investigation"]],
              "known_unavailable": [x["number"] for x in audit["known_unavailable"]],
          }, ensure_ascii=False, indent=2))
          print(f"Validated {len(episodes)} catalogue episodes")
          PY
      - name: Remove one-off workflow and commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/request-009-publish.yml
          git add data/episodes.json
          git commit -m "Publish verified provider releases for episodes 226 238 and 239"
          git push origin HEAD:request/009-audio-track-naming-and-availability
