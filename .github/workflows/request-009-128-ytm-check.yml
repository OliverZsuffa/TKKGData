name: Request 009 independently verify episode 128 YouTube Music

on:
  push:
    branches:
      - request/009-audio-track-naming-and-availability

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: request/009-audio-track-naming-and-availability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube Music discovery dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audio.txt
      - name: Verify episode 128 independently on YouTube Music
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scraper.audio_enrichment import _load_ytmusic, find_verified_youtube_music_release

          episodes = json.loads(Path("data/episodes.json").read_text(encoding="utf-8"))
          episode = next(item for item in episodes if item["number"] == 128)
          ytm = _load_ytmusic()
          try:
              release = find_verified_youtube_music_release(episode, ytm)
          except Exception as exc:
              print("RESULT: NO INDEPENDENTLY VERIFIED YOUTUBE MUSIC RELEASE")
              print(f"DETAILS: {exc}")
          else:
              tracks = release["tracks"]
              chapters = [
                  track for track in tracks
                  if re.search(r"\\b(?:Teil|Part|Kapitel)\\s*0*\\d+\\b", track["title"], re.I)
              ]
              print("RESULT: VERIFIED YOUTUBE MUSIC RELEASE")
              print(json.dumps({
                  "album": release.get("album"),
                  "playlist": release.get("playlist"),
                  "track_count": release.get("track_count"),
                  "chapter_count": len(chapters),
                  "first_chapter": chapters[0]["title"] if chapters else None,
                  "last_chapter": chapters[-1]["title"] if chapters else None,
              }, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-off verification workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/request-009-128-ytm-check.yml
          git commit -m "Remove one-off episode 128 verification workflow"
          git push origin HEAD:request/009-audio-track-naming-and-availability
